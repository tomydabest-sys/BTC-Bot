[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.0"
description = "Automated trading bot for Polymarket prediction markets"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "web3>=6.0",
    "eth-account>=0.11",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "aiosqlite>=0.19",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "py-clob-client>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
polybot = "polybot.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
