[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-bot"
version = "0.4.0"
description = "Polymarket BTC Up/Down trading bot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pydantic>=2.5",
    "pyyaml>=6",
    "structlog>=24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1",
    "aiosqlite>=0.19",
    # Live mode dependencies — required when LIVE_TRADING_ENABLED is flipped True.
    # Pinned loose so users can pick a version compatible with their Polygon RPC.
    # "py-clob-client>=0.16",
    # "web3>=6",
    # "eth-account>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]
# Live trading on CLOB V2. The SDK package name is the post-Apr-2026
# release; the wrapper in src/polybot/api/clob_v2_client.py guards the
# import so paper mode keeps working without these.
live = [
    "py-clob-client-v2",
    "web3>=6",
    "eth-account>=0.10",
    "keyring>=24",
]
# Secrets helper alone (no live trading)
secrets = [
    "keyring>=24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
