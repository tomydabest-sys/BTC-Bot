# Strategy allocation (also the per-strategy open-exposure cap = weight ×
# bankroll). negative_risk_arb is DISABLED (weight 0): it sprays the sub-15c
# long-shot tail — the source of 100% of the operator's losses, and the band
# the weather-wallet research shows bleeds. Bump it above 0 to re-enable.
weights:
  weather_ensemble: 0.80
  negative_risk_arb: 0.0
  resolution_meanrev: 0.20

# Middle-band price gate for weather_ensemble (wallet-research headline
# finding): only BUY a share priced in [min, max]; sub-min long-shots require
# p_win >= longshot_override_mult × price (a steep, deliberately rare override).
price_band:
  min: 0.15
  max: 0.85
  longshot_override_mult: 3.0

edge_threshold_bps:
  weather_ensemble: 800        # 8.00%
  negative_risk_arb: 200       # 2.00%
  resolution_meanrev: 500      # 5.00%

confidence_minimum:
  weather_ensemble: 0.55
  negative_risk_arb: 0.95
  resolution_meanrev: 0.85

# Per-strategy P&L share cap — no single strategy may produce >60% of P&L over rolling 30d
# (validation gate criterion #6)
max_pl_share_per_strategy: 0.60
