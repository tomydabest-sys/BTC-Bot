# Wallet-watch — tracked-trader confirmation signal (DASHBOARD ONLY).
#
# These wallets are polled (data-api.polymarket.com) for recent *weather*
# activity and surfaced at /api/weather/wallet-watch as a confirmation signal.
# It NEVER gates or sizes trades, and must never be a reason to loosen risk.
#
# IMPORTANT — read before populating:
#   * The original "weather_wallet_analysis.md" naming the profitable four was
#     never committed to this repo, and the 11 addresses in wallet_profiler.py
#     are BTC/ETH up-or-down 5-minute scalpers, NOT weather traders. So this
#     list starts EMPTY on purpose.
#   * Regenerate candidates from live data with:
#         python scripts/polyweather/discover_weather_wallets.py
#     then confirm a wallet is genuinely weather-profitable (round-trip P&L,
#     not a single open position) before adding it here.
#
# Each entry: {address: "0x...", label: "human name"}.
