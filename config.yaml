bot:
  name: "btc-bot"
  mode: "paper"  # "paper" or "live"
  log_level: "INFO"
  data_dir: "./data"

wallet:
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  api_key_env: "POLYMARKET_API_KEY"

scanner:
  interval_seconds: 30           # Scan every 30s — short markets roll constantly
  min_volume_24h: 0              # New 5/15-min windows start at $0 volume
  min_liquidity: 50              # Minimal liquidity threshold
  max_spread_pct: 15.0           # Short-window markets have wider spreads
  categories_allowlist: []
  categories_blocklist: []
  resolution_window_days: [0, 1] # Only markets resolving within 24 hours

  # BTC Up/Down filter — ONLY these markets
  btc_updown_only: true
  btc_keywords:
    - "bitcoin up or down"
    - "btc up or down"
  btc_timeframes:                # Which windows to trade
    - "5 min"
    - "15 min"
    - "1 hour"
    - "4 hour"

strategies:
  enabled:
    # --- Core strategies for BTC up/down markets ---

    - name: "latency_arb"
      weight: 1.0
      params:
        min_gap_pct: 0.03
        max_gap_pct: 0.15
        min_exchange_move_pct: 0.02
        fee_buffer_pct: 0.01
        size_pct: 0.08
        exchange_symbol: "BTC"

    - name: "momentum_lag"
      weight: 1.0
      params:
        min_move_30s_pct: 0.015
        min_move_60s_pct: 0.025
        min_gap_pct: 0.03
        thin_book_threshold: 0.04
        size_pct: 0.07
        exchange_symbol: "BTC"

    - name: "volatility_breakout"
      weight: 0.8
      params:
        compression_ratio: 0.4
        breakout_threshold_pct: 0.02
        lookback_compress_seconds: 120
        lookback_baseline_seconds: 600
        min_spread: 0.03
        size_pct: 0.06
        exchange_symbol: "BTC"

    - name: "monte_carlo"
      weight: 0.8
      params:
        num_simulations: 5000
        min_edge_pct: 0.05
        time_window_minutes: 15
        vol_lookback_seconds: 300
        size_pct: 0.05
        exchange_symbol: "BTC"

    - name: "dual_direction_arb"
      weight: 1.0
      params:
        min_profit_pct: 0.01
        max_total_cost: 0.99
        min_liquidity_each_side: 50.0
        size_pct: 0.10

    # --- Secondary strategies (lower weight) ---

    - name: "mean_reversion"
      weight: 0.5
      params:
        deviation_threshold: 0.03
        lookback_minutes: 60
        exit_threshold: 0.01
        stop_loss_multiplier: 2.0
        max_hold_minutes: 120

    - name: "momentum"
      weight: 0.3
      params:
        price_change_threshold: 0.05
        lookback_minutes: 60
        volume_multiplier: 2.0
        take_profit: 0.03
        trailing_stop: 0.02

    - name: "market_maker"
      weight: 0.3
      params:
        min_spread: 0.03
        target_spread: 0.04
        max_inventory_pct: 0.15
        skew_factor: 0.5
        size_pct: 0.04

  aggregation:
    min_confidence: 0.5
    conflict_resolution: "skip"

risk:
  max_position_size: 100         # Tuned for $100-500 budget
  max_portfolio_exposure: 500
  max_positions: 5
  max_daily_loss: 25             # Max $25/day loss — 5% of $500
  min_trade_interval_seconds: 15 # Faster for short-window markets
  max_order_size: 50
  max_slippage_pct: 3.0          # Higher tolerance for thin books
  circuit_breakers:
    consecutive_losses_pause: 3
    consecutive_losses_size_reduction: 0.5
    api_errors_per_minute_pause: 5
    ws_disconnect_cancel_seconds: 120

execution:
  rate_limit_per_second: 5
  order_ttl_seconds: 120         # Shorter TTL — markets resolve fast
  retry_attempts: 3
  retry_backoff_seconds: [1, 2, 4]

monitoring:
  metrics_port: 9090
  alerts:
    discord_webhook_env: "DISCORD_WEBHOOK_URL"
    telegram_bot_token_env: "TELEGRAM_BOT_TOKEN"
    telegram_chat_id_env: "TELEGRAM_CHAT_ID"
  daily_summary_hour: 18
    telegram_chat_id_env: "TELEGRAM_CHAT_ID"
  daily_summary_hour: 18
