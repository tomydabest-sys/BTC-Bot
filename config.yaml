bot:
  name: "btc-bot"
  mode: "paper"
  log_level: "INFO"
  data_dir: "./data"

wallet:
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  api_key_env: "POLYMARKET_API_KEY"

scanner:
  interval_seconds: 30
  min_volume_24h: 0
  min_liquidity: 10
  max_spread_pct: 20.0
  categories_allowlist: []
  categories_blocklist: []
  resolution_window_days: [0, 1]
  btc_updown_only: true
  btc_timeframes: ["5 min"]

strategies:
  enabled:
    - name: "latency_arb"
      weight: 1.0
      params:
        # Relaxed from 0.01 — tight BTC 5-min markets need lower threshold
        min_gap_pct: 0.008
        max_gap_pct: 0.25
        # Relaxed from 0.002 — catches more moves in ranging conditions
        min_exchange_move_pct: 0.0015
        fee_buffer_pct: 0.003
        size_pct: 0.04
        confidence_floor: 0.55
        exchange_symbol: "BTC"
        # Micro-lag predictor: extrapolates BTC 500ms forward
        enable_micro_lag: true

    - name: "momentum_lag"
      weight: 1.0
      params:
        # Relaxed from 0.002/0.004 — BTC was ranging 0.15-0.37% during dead period
        min_move_30s_pct: 0.0015
        min_move_60s_pct: 0.0025
        min_gap_pct: 0.008
        max_gap_pct: 0.20
        thin_book_threshold: 0.01
        size_pct: 0.04
        exchange_symbol: "BTC"

    - name: "dual_direction_arb"
      weight: 1.0
      params:
        min_profit_pct: 0.01
        max_total_cost: 0.99
        min_liquidity_each_side: 10.0
        size_pct: 0.06

  aggregation:
    min_confidence: 0.55
    conflict_resolution: "highest_confidence"

risk:
  max_position_size: 30
  max_portfolio_exposure: 150
  max_positions: 5
  max_daily_loss: 25
  # Reduced from 8s — allows faster re-entry on different markets
  min_trade_interval_seconds: 5
  max_order_size: 20
  max_slippage_pct: 5.0
  circuit_breakers:
    consecutive_losses_pause: 8
    consecutive_losses_size_reduction: 0.5
    api_errors_per_minute_pause: 15
    ws_disconnect_cancel_seconds: 30

execution:
  rate_limit_per_second: 5
  order_ttl_seconds: 15
  retry_attempts: 1
  retry_backoff_seconds: [1]

monitoring:
  metrics_port: 9090
  alerts:
    discord_webhook_env: "DISCORD_WEBHOOK_URL"
    telegram_bot_token_env: "TELEGRAM_BOT_TOKEN"
    telegram_chat_id_env: "TELEGRAM_CHAT_ID"
  daily_summary_hour: 18
