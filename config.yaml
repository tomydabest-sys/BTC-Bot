bot:
  name: "btc-bot"
  mode: "paper"
  log_level: "INFO"
  data_dir: "./data"

wallet:
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  api_key_env: "POLYMARKET_API_KEY"

scanner:
  interval_seconds: 30
  min_volume_24h: 0
  min_liquidity: 10
  max_spread_pct: 30.0
  categories_allowlist: []
  categories_blocklist: []
  resolution_window_days: [0, 7]            # widened: was [0, 1] — covers 4h and daily
  btc_updown_only: true
  btc_timeframes: ["5 min", "15 min", "1 hour", "4 hour", "daily"]   # ALL timeframes (was 5m only)

strategies:
  enabled:
    # ── PRIMARY: overshoot reversion (retuned for spring-2026 vol regime) ──
    - name: "overshoot_reversion"
      weight: 1.0
      params:
        # BTC trigger — relaxed for typical low-vol windows
        min_btc_move_60s_pct: 0.0015        # 0.15% in 60s ≈ $116 at $77.7k
        min_btc_move_30s_pct: 0.0010        # 0.10% in 30s ≈ $77 — either gates ok
        # Polymarket burst — was 0.025 (top 5% of cycles); now 0.008 (~25%)
        min_poly_burst: 0.008                # was 0.025
        # Overshoot magnitude
        min_overshoot: 0.010                 # was 0.020 — 1¢ past Black-Scholes fair
        max_overshoot: 0.120                 # cap — beyond = news event, abstain
        # Time gates (relaxed)
        min_time_remaining: 60.0             # was 90s
        max_time_remaining: 270.0            # don't fade in first 30s of 5m
        # Entry band (widened)
        min_poly_mid: 0.15                   # was 0.25
        max_poly_mid: 0.85                   # was 0.75
        max_spread: 0.040                    # was 0.030 — tolerate wider books
        min_btc_move_confirm: 0.0005
        size_pct: 0.05
        confidence_floor: 0.50               # was 0.55
        window_seconds: 300.0
        # Fair value model — Black-Scholes binary on EWMA realized vol
        fair_value_model: "black_scholes"    # was implicit sigmoid
        sigma_lookback_s: 900
        sigma_halflife_s: 60
        # Fee awareness
        fee_theta_taker: 0.072               # ~1.8% peak fee at p=0.5
        edge_floor_bps: 10                   # don't trade below 10 bps net edge
        exchange_symbol: "BTC"

    # ── DUAL DIRECTION ARB (refined) ─────────────────────────────────────
    - name: "dual_direction_arb"
      weight: 1.0
      params:
        min_profit_pct: 0.005                # was 0.01 — 0.5% net of fees realistic
        max_total_cost: 0.985                # buy both ≤98.5¢ → ≥1.5¢ profit
        min_liquidity_each_side: 5.0         # was 10 — match Polymarket min order
        size_pct: 0.06
        require_recent_trade_seconds: 30     # NEW: anti-stale-book defense

    # ── BOUNDARY DECAY (new strategy: trade near-certainty terminal payoffs) ──
    - name: "boundary_decay"
      weight: 1.0
      params:
        max_time_remaining: 60.0             # only the last minute of the window
        min_btc_delta_pct: 0.0010            # 0.10% BTC delta from open
        fade_above_price: 0.92               # short the losing side if priced >$0.92
        fade_below_price: 0.08               # buy the winning side if priced <$0.08
        min_edge_cents: 0.015                # require ≥1.5¢ edge after fees
        size_pct: 0.06
        confidence_floor: 0.65               # high floor — these should be near-certain
        sigma_lookback_s: 900
        sigma_halflife_s: 60
        fee_theta_taker: 0.072
        exchange_symbol: "BTC"

    # ── MAKER EDGE (passive liquidity — earn spread + Polymarket rebate) ──
    - name: "maker_edge"
      weight: 0.7
      params:
        min_spread: 0.015                    # need ≥1.5¢ spread to be worth quoting
        quote_offset: 0.005                  # post 0.5¢ inside best
        max_inventory: 0.20
        inventory_skew: 0.5
        size_pct: 0.04
        time_of_day_filter: true
        volume_boost_threshold: 5000.0

    # ── (DISABLED) latency_arb — uneconomic at retail post-Feb-2026 dynamic fees ──
    # Kept in registry for git history; do not delete the source file.
    # See research finding: Polymarket peak fee 1.8–3.15% at p=0.5 exceeds
    # typical 1–3¢ retail latency edge. Re-enable only if Polymarket fee
    # structure changes again.
    #
    # - name: "latency_arb"
    #   weight: 0
    #   params: {}

    # ── (DISABLED) momentum_lag — overlaps overshoot_reversion ──
    # - name: "momentum_lag"
    #   weight: 0
    #   params: {}

  aggregation:
    min_confidence: 0.40                     # was 0.55 — silent killer at sigmoid saturation
    conflict_resolution: "weighted_vote"     # was "highest_confidence"
    strategy_weights:
      overshoot_reversion: 0.30
      dual_direction_arb: 0.30
      boundary_decay: 0.25
      maker_edge: 0.15
    min_net_score: 0.30

risk:
  max_position_size: 30
  max_portfolio_exposure: 150
  max_positions: 6                            # was 5
  max_daily_loss: 25
  min_trade_interval_seconds: 2               # was 5 — per-market, not global
  max_order_size: 20
  max_slippage_pct: 5.0
  # NEW: Quarter-Kelly sizing, per-timeframe caps
  bankroll_usd: 500
  kelly_fraction: 0.25
  hard_cap_pct: 0.06
  edge_floor_bps: 10
  per_timeframe_cap_pct:
    "5m": 0.02
    "15m": 0.03
    "1h": 0.05
    "4h": 0.06
    "daily": 0.06
  circuit_breakers:
    consecutive_losses_pause: 8
    consecutive_losses_size_reduction: 0.5
    api_errors_per_minute_pause: 15
    ws_disconnect_cancel_seconds: 30

execution:
  rate_limit_per_second: 5
  order_ttl_seconds: 15
  retry_attempts: 1
  retry_backoff_seconds: [1]
  # NEW: trading-loop tuning
  loop_interval_ms: 500                       # was 1000 — 2× signal opportunity
  max_trades_per_cycle: 6                     # was 1 — global cap
  max_trades_per_market_per_cycle: 1          # NEW — parallelise across markets
  cooldown_per_market: true                   # NEW — was global
  high_conf_override_after_s: 1.0
  high_conf_override_threshold: 0.85
  auto_close_before_expiry_s: 20              # was 30

monitoring:
  metrics_port: 9090
  alerts:
    discord_webhook_env: "DISCORD_WEBHOOK_URL"
    telegram_bot_token_env: "TELEGRAM_BOT_TOKEN"
    telegram_chat_id_env: "TELEGRAM_CHAT_ID"
  daily_summary_hour: 18

# Decision log (NEW)
decision_log:
  path: "logs/decisions.jsonl"
  flush_every: 25
