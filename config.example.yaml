bot:
  name: "polymarket-bot"
  mode: "paper"  # "paper" or "live"
  log_level: "INFO"
  data_dir: "./data"

wallet:
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  api_key_env: "POLYMARKET_API_KEY"

scanner:
  interval_seconds: 120
  min_volume_24h: 1000
  min_liquidity: 500
  max_spread_pct: 10.0
  categories_allowlist: []
  categories_blocklist: []
  resolution_window_days: [0, 90]

strategies:
  enabled:
    - name: "mean_reversion"
      weight: 1.0
      params:
        deviation_threshold: 0.03
        lookback_minutes: 60
        exit_threshold: 0.01
        stop_loss_multiplier: 2.0
        max_hold_minutes: 120

    - name: "momentum"
      weight: 0.5
      params:
        price_change_threshold: 0.05
        lookback_minutes: 60
        volume_multiplier: 2.0
        take_profit: 0.03
        trailing_stop: 0.02

    - name: "latency_arb"
      weight: 1.0
      params:
        min_gap_pct: 0.03
        max_gap_pct: 0.15
        min_exchange_move_pct: 0.02
        fee_buffer_pct: 0.01
        size_pct: 0.08
        exchange_symbol: "BTC"

    - name: "momentum_lag"
      weight: 1.0
      params:
        min_move_30s_pct: 0.015
        min_move_60s_pct: 0.025
        min_gap_pct: 0.03
        thin_book_threshold: 0.04
        size_pct: 0.07
        exchange_symbol: "BTC"

    - name: "volatility_breakout"
      weight: 0.8
      params:
        compression_ratio: 0.4
        breakout_threshold_pct: 0.02
        lookback_compress_seconds: 120
        lookback_baseline_seconds: 600
        min_spread: 0.03
        size_pct: 0.06
        exchange_symbol: "BTC"

    - name: "dual_direction_arb"
      weight: 1.0
      params:
        min_profit_pct: 0.01
        max_total_cost: 0.99
        min_liquidity_each_side: 50.0
        size_pct: 0.10

    - name: "market_maker"
      weight: 0.5
      params:
        min_spread: 0.03
        target_spread: 0.04
        max_inventory_pct: 0.15
        skew_factor: 0.5
        size_pct: 0.04

    - name: "monte_carlo"
      weight: 0.8
      params:
        num_simulations: 5000
        min_edge_pct: 0.05
        time_window_minutes: 15
        vol_lookback_seconds: 300
        size_pct: 0.05
        exchange_symbol: "BTC"

  aggregation:
    min_confidence: 0.5
    conflict_resolution: "skip"

risk:
  max_position_size: 500
  max_portfolio_exposure: 5000
  max_positions: 10
  max_daily_loss: 250
  min_trade_interval_seconds: 30
  max_order_size: 200
  max_slippage_pct: 2.0
  circuit_breakers:
    consecutive_losses_pause: 3
    consecutive_losses_size_reduction: 0.5
    api_errors_per_minute_pause: 5
    ws_disconnect_cancel_seconds: 120

execution:
  rate_limit_per_second: 5
  order_ttl_seconds: 300
  retry_attempts: 3
  retry_backoff_seconds: [1, 2, 4]

monitoring:
  metrics_port: 9090
  alerts:
    discord_webhook_env: "DISCORD_WEBHOOK_URL"
    telegram_bot_token_env: "TELEGRAM_BOT_TOKEN"
    telegram_chat_id_env: "TELEGRAM_CHAT_ID"
  daily_summary_hour: 18
