bot:
  name: "btc-bot"
  mode: "paper"
  log_level: "INFO"
  data_dir: "./data"

wallet:
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  api_key_env: "POLYMARKET_API_KEY"

scanner:
  interval_seconds: 30
  min_volume_24h: 0
  min_liquidity: 10
  max_spread_pct: 30.0
  categories_allowlist: []
  categories_blocklist: []
  resolution_window_days: [0, 7]
  btc_updown_only: true
  btc_timeframes: ["5 min", "15 min", "1 hour", "4 hour", "daily"]

strategies:
  enabled:
    # ── PHASE 1 PRIMARY: overshoot_reversion (max sensitivity) ─────────
    - name: "overshoot_reversion"
      weight: 0.45
      params:
        # BTC trigger — lowered to ~half a basis point
        min_btc_move_60s_pct: 0.0004
        min_btc_move_30s_pct: 0.0003
        # Polymarket burst — single-tick move qualifies
        min_poly_burst: 0.002
        # Overshoot magnitude — 0.3¢ minimum
        min_overshoot: 0.003
        max_overshoot: 0.150
        # Time gates — wider than baseline
        min_time_remaining: 45.0
        max_time_remaining: 285.0
        # Entry band — most of the book
        min_poly_mid: 0.10
        max_poly_mid: 0.90
        max_spread: 0.10
        min_btc_move_confirm: 0.0002
        size_pct: 0.05
        confidence_floor: 0.35
        window_seconds: 300.0
        fair_value_model: "black_scholes"
        sigma_lookback_s: 900
        sigma_halflife_s: 60
        fee_theta_taker: 0.072
        edge_floor_bps: 1
        exchange_symbol: "BTC"

    # ── PHASE 1 PRIMARY: maker_edge (highest fire rate, cheapest fees) ──
    - name: "maker_edge"
      weight: 0.40
      params:
        min_spread: 0.005
        quote_offset: 0.002
        max_inventory: 0.30
        inventory_skew: 0.5
        size_pct: 0.04
        time_of_day_filter: false
        volume_boost_threshold: 100.0
        confidence_floor: 0.40

    # ── PHASE 1 SECONDARY: boundary_decay (extended firing window) ─────
    - name: "boundary_decay"
      weight: 0.15
      params:
        max_time_remaining: 120.0
        min_btc_delta_pct: 0.0003
        fade_above_price: 0.80
        fade_below_price: 0.20
        min_edge_cents: 0.003
        size_pct: 0.06
        confidence_floor: 0.40
        sigma_lookback_s: 900
        sigma_halflife_s: 60
        fee_theta_taker: 0.072
        exchange_symbol: "BTC"

    # ── DISABLED in Phase 1: dual_direction_arb (re-enable in Phase 2) ──
    # - name: "dual_direction_arb"
    #   weight: 0.0

  aggregation:
    min_confidence: 0.20
    conflict_resolution: "weighted_vote"
    strategy_weights:
      overshoot_reversion: 0.45
      maker_edge: 0.40
      boundary_decay: 0.15
    min_net_score: 0.05

risk:
  max_position_size: 50
  max_portfolio_exposure: 200
  max_positions: 8
  max_daily_loss: 25
  min_trade_interval_seconds: 1
  max_order_size: 30
  max_slippage_pct: 5.0
  bankroll_usd: 500
  kelly_fraction: 0.50
  hard_cap_pct: 0.10
  edge_floor_bps: 1
  per_timeframe_cap_pct:
    "5m": 0.05
    "15m": 0.06
    "1h": 0.06
    "4h": 0.07
    "daily": 0.07
  circuit_breakers:
    consecutive_losses_pause: 12
    consecutive_losses_size_reduction: 0.5
    api_errors_per_minute_pause: 20
    ws_disconnect_cancel_seconds: 30

execution:
  rate_limit_per_second: 5
  order_ttl_seconds: 15
  retry_attempts: 1
  retry_backoff_seconds: [1]
  loop_interval_ms: 500
  max_trades_per_cycle: 10
  max_trades_per_market_per_cycle: 1
  cooldown_per_market: true
  high_conf_override_after_s: 0.5
  high_conf_override_threshold: 0.75
  auto_close_before_expiry_s: 15

monitoring:
  metrics_port: 9090
  alerts:
    discord_webhook_env: "DISCORD_WEBHOOK_URL"
    telegram_bot_token_env: "TELEGRAM_BOT_TOKEN"
    telegram_chat_id_env: "TELEGRAM_CHAT_ID"
  daily_summary_hour: 18

decision_log:
  path: "logs/decisions.jsonl"
  flush_every: 25
